name: AI Test Writer

# 多语言触发：src/ 下任一受支持语言的源码变更都会触发
on:
  push:
    branches: [main]
    paths:
      - "src/**/*.py"
      - "src/**/*.js"
      - "src/**/*.ts"
      - "src/**/*.java"
      - "src/**/*.go"
      - "src/**/*.rs"
      - "src/**/*.c"
      - "src/**/*.cpp"
      - "src/**/*.hpp"
      - "!src/**/*.test.*"
  pull_request:
    paths:
      - "src/**/*.py"
      - "src/**/*.js"
      - "src/**/*.ts"
      - "src/**/*.java"
      - "src/**/*.go"
      - "src/**/*.rs"
      - "src/**/*.c"
      - "src/**/*.cpp"
      - "src/**/*.hpp"
      - "!src/**/*.test.*"

permissions:
  contents: write

concurrency:
  group: ai-test-writer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  write-tests:
    # 机器人自己的提交带 [skip ci] 标记 -> 跳过，防止无限循环
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install pytest

      - name: Find changed source files
        id: changed
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD -- \
            'src/**/*.py' 'src/*.py' \
            'src/**/*.js' 'src/*.js' \
            'src/**/*.ts' 'src/*.ts' \
            'src/**/*.java' 'src/*.java' \
            'src/**/*.go' 'src/*.go' \
            'src/**/*.rs' 'src/*.rs' \
            'src/**/*.c' 'src/*.c' \
            'src/**/*.cpp' 'src/*.cpp' \
            'src/**/*.hpp' 'src/*.hpp' || true)
          CHANGED=$(echo "$CHANGED" | grep -v '\.test\.' || true)
          echo "changed files: ${CHANGED:-<none>}"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Generate tests with DeepSeek
        if: steps.changed.outputs.changed != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL || 'deepseek-chat' }}
        run: |
          for f in ${{ steps.changed.outputs.changed }}; do
            echo "=== generating tests for $f ==="
            python scripts/write_tests.py --source "$f"
          done

      - name: Run generated tests (Python)
        if: steps.changed.outputs.changed != ''
        run: |
          # 只跑已生成的 Python 测试；失败的测试作为评审输入而非 CI 阻断
          python -m pytest tests -v --tb=short || true

      - name: Run generated tests (JavaScript)
        if: steps.changed.outputs.changed != ''
        run: |
          # 若生成的是 Jest 测试且有 package.json 则尝试运行
          if ls tests/*.test.js >/dev/null 2>&1 && [ -f package.json ]; then
            npm install --no-save jest >/dev/null 2>&1 || true
            npx jest tests --passWithNoTests 2>&1 || true
          else
            echo "无 JS 测试或缺少 package.json，跳过 JS 运行"
          fi

      - name: Commit and push generated tests
        if: steps.changed.outputs.changed != ''
        run: |
          git config user.name "ai-test-writer[bot]"
          git config user.email "ai-test-writer[bot]@users.noreply.github.com"
          git add tests/
          if git diff --cached --quiet; then
            echo "No new tests to commit"
          else
            git commit -m "🤖 AI 自动生成单元测试 [skip ci]"
            git push origin "${{ github.head_ref || github.ref_name }}"
          fi
